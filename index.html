<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SOLIDWORKS 構成ツリービューア</title>
<style>
:root{font-family:system-ui,"Yu Gothic",Meiryo,sans-serif;color:#243346;background:#f3f6fa}
*{box-sizing:border-box}body{margin:0}header{background:#fff;padding:18px 24px;border-bottom:1px solid #dce3ec;display:flex;flex-wrap:wrap;gap:15px;align-items:center;justify-content:space-between}h1{font-size:21px;margin:0}header p{font-size:12px;color:#657588;margin:5px 0 0}
button,.upload{font:inherit;border:1px solid #cbd6e2;border-radius:8px;background:#fff;padding:9px 12px;cursor:pointer}.upload{display:inline-block;background:#2563aa;color:#fff;border-color:#2563aa}.upload input{display:none}button:hover{background:#edf4fc}.upload:hover{background:#194f8b}
.actions{display:flex;gap:8px;flex-wrap:wrap}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:18px 20px}.stat,.panel{background:#fff;border:1px solid #dce3eb;border-radius:11px}.stat{padding:14px}.stat strong{display:block;font-size:23px}.stat span{font-size:12px;color:#66758a}
.layout{display:grid;grid-template-columns:minmax(300px,1.25fr) minmax(280px,.85fr);gap:15px;margin:0 20px 20px}.panel{min-width:0;overflow:hidden}.panel-header{padding:16px;border-bottom:1px solid #e7ebf1}.panel-header strong{display:block}.bar{display:flex;gap:7px;margin-top:12px;flex-wrap:wrap}input[type=search],select{font:inherit;border:1px solid #ccd7e3;border-radius:7px;padding:9px;min-width:0}input[type=search]{flex:1;min-width:140px}select{max-width:100%}.tree{padding:12px;max-height:68vh;overflow:auto;min-height:220px}.tree-node{display:flex;gap:5px;align-items:center;cursor:pointer;border-radius:5px;min-height:30px;font-size:13px;white-space:nowrap}.tree-node:hover{background:#f0f5fc}.tree-node.active{background:#e4efff}.toggle{border:0;padding:2px;width:26px;background:transparent}.children{padding-left:22px;border-left:1px solid #e6eaf0;margin-left:12px}.name{overflow:hidden;text-overflow:ellipsis}.tag{font-size:10px;color:#7c8796;background:#f0f2f5;border-radius:4px;padding:2px 5px}.details{padding:18px;overflow:auto;max-height:68vh}dl{margin:0}dt{font-size:12px;color:#617187;margin-top:13px}dd{margin:4px 0;overflow-wrap:anywhere;font-size:14px}footer{padding:0 20px 20px;font-size:12px;color:#718096}.notice{margin:10px 14px;color:#62718a;font-size:12px}.empty{color:#7d8a9b;font-size:14px;padding:24px 9px}
@media(max-width:750px){.layout{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<header><div><h1>📁 SOLIDWORKS 構成ツリービューア</h1><p>CSVからフォルダ・モデルの階層を再現します。読み込んだデータはサーバーに送信されません。</p></div><div class="actions"><label class="upload">CSVを追加<input id="files" type="file" accept=".csv,text/csv" multiple></label><button id="export" disabled>JSON出力</button></div></header>
<div class="stats"><div class="stat"><strong id="folderCount">0</strong><span>フォルダ数</span></div><div class="stat"><strong id="modelCount">0</strong><span>モデル配置数</span></div><div class="stat"><strong id="asmCount">0</strong><span>サブアセンブリ数</span></div><div class="stat"><strong id="suppCount">0</strong><span>抑制ノード数</span></div></div>
<div class="layout"><section class="panel"><div class="panel-header"><strong id="assemblyTitle">CSVを読み込んでください</strong><div class="bar"><input id="search" type="search" placeholder="フォルダ名・モデル名で検索"><button id="expand">すべて展開</button><button id="collapse">すべて折りたたむ</button></div><div class="bar"><select id="assemblySelect" aria-label="表示するアセンブリ"></select></div></div><div class="notice" id="message">CSVを追加すると構成ツリーが表示されます。</div><div class="tree" id="tree" role="tree"></div></section><aside class="panel"><div class="panel-header"><strong>選択した項目の詳細</strong></div><div class="details" id="details"><div class="empty">ツリーの項目を選択してください。</div></div></aside></div>
<footer>参照専用：SOLIDWORKSやCADファイルを変更しません。Google Drive保存機能は未実装です。業務データをGitHubへコミットしないでください。</footer>
<script>
"use strict";
const $=id=>document.getElementById(id), datasets=[];
let current=-1, selectedId=null, expanded=new Set();
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function parseCSV(text){
  text=text.replace(/^\uFEFF/,"");let records=[],row=[],field="",quoted=false;
  for(let i=0;i<text.length;i++){let c=text[i];if(quoted){if(c==='"'&&text[i+1]==='"'){field+='"';i++}else if(c==='"')quoted=false;else field+=c}else if(c==='"')quoted=true;else if(c===","){row.push(field);field=""}else if(c==="\r"||c==="\n"){if(c==="\r"&&text[i+1]==="\n")i++;row.push(field);if(row.some(v=>v!==""))records.push(row);row=[];field=""}else field+=c}
  if(field!==""||row.length){row.push(field);records.push(row)}
  if(!records.length)throw Error("CSVが空です");
  const headers=records.shift().map(x=>x.trim());
  for(const h of ["NodeId","ParentId","NodeType","Order","FolderName","ModelName"])if(!headers.includes(h))throw Error("必須列がありません: "+h);
  return records.map(vals=>Object.fromEntries(headers.map((h,i)=>[h,vals[i]??""])));
}
function addData(name,rows){
  const map=new Map();
  for(const r of rows){if(!r.NodeId||map.has(r.NodeId))throw Error("NodeIdに空欄または重複があります");map.set(r.NodeId,{...r,children:[]})}
  const roots=[];let missing=0;
  for(const n of map.values()){if(n.ParentId&&map.has(n.ParentId)&&n.ParentId!==n.NodeId){map.get(n.ParentId).children.push(n)}else{roots.push(n);if(n.ParentId)missing++}}
  const order=(a,b)=>(Number(a.Order)||0)-(Number(b.Order)||0);
  roots.sort(order);for(const n of map.values())n.children.sort(order);
  const data={name,rows,map,roots,missing,assembly:rows.find(r=>r.AssemblyName)?.AssemblyName||name};
  const i=datasets.findIndex(d=>d.name===name);if(i>=0)datasets[i]=data;else datasets.push(data);
  $("assemblySelect").innerHTML=datasets.map((d,k)=>'<option value="'+k+'">'+esc(d.assembly)+" ("+esc(d.name)+")</option>").join("");
  switchTo(i>=0?i:datasets.length-1);
}
function switchTo(i){
  current=i;selectedId=null;let d=datasets[i];expanded=new Set(d.roots.map(r=>r.NodeId));
  $("assemblySelect").value=String(i);$("assemblyTitle").textContent=d.assembly;
  $("folderCount").textContent=d.rows.filter(r=>r.NodeType==="folder").length.toLocaleString();
  $("modelCount").textContent=d.rows.filter(r=>r.NodeType==="component").length.toLocaleString();
  $("asmCount").textContent=d.rows.filter(r=>r.ComponentType==="assembly").length.toLocaleString();
  $("suppCount").textContent=d.rows.filter(r=>r.Suppressed==="true").length.toLocaleString();
  $("message").textContent=d.missing?"親ノード未検出: "+d.missing+"件。ルートに表示しています。":"項目をクリックすると詳細を表示します。";
  $("details").innerHTML='<div class="empty">ツリーの項目を選択してください。</div>';
  $("search").value="";$("export").disabled=false;render();
}
function render(){
  if(current<0)return;
  const d=datasets[current],q=$("search").value.toLocaleLowerCase().trim(),keep=new Set();
  if(q)for(const n of d.map.values())if((n.FolderName+" "+n.ModelName+" "+n.FilePath).toLocaleLowerCase().includes(q)){let x=n,guard=0;while(x&&guard++<d.map.size){keep.add(x.NodeId);x=d.map.get(x.ParentId)}}
  const seen=new Set();
  function nodeHTML(n){if(seen.has(n.NodeId)||q&&!keep.has(n.NodeId))return "";seen.add(n.NodeId);
    const open=!!q||expanded.has(n.NodeId),folder=n.NodeType==="folder",label=folder?n.FolderName:n.ModelName||n.NodeId;
    const icon=folder?(open?"📂":"📁"):n.ComponentType==="assembly"?"📦":"⚙️";
    let out='<div class="tree-node '+(n.NodeId===selectedId?"active":"")+'" data-id="'+esc(n.NodeId)+'"><button class="toggle" data-toggle="'+esc(n.NodeId)+'" aria-label="展開切替">'+(n.children.length?(open?"▾":"▸"):"")+'</button><span>'+icon+'</span><span class="name" title="'+esc(label)+'">'+esc(label)+'</span>'+(n.Suppressed==="true"?'<span class="tag">抑制</span>':"")+"</div>";
    if(open&&n.children.length)out+='<div class="children">'+n.children.map(nodeHTML).join("")+"</div>";return out;
  }
  $("tree").innerHTML=d.roots.map(nodeHTML).join("")||'<div class="empty">該当する項目がありません。</div>';
}
function detail(id){
  const n=datasets[current].map.get(id);if(!n)return;selectedId=id;
  const props=[["種類",n.NodeType==="folder"?"フォルダ":n.ComponentType==="assembly"?"サブアセンブリ":"部品"],["ノードID",n.NodeId],["親ID",n.ParentId||"最上位"],["階層",n.Level],["表示順",n.Order],["フォルダ名",n.FolderName],["フォルダパス",n.FolderPath],["モデル名",n.ModelName],["ファイルパス",n.FilePath],["コンフィギュレーション",n.Configuration],["抑制",n.Suppressed],["子ノード数",n.children.length]];
  $("details").innerHTML="<h2>"+esc(n.NodeType==="folder"?n.FolderName:n.ModelName)+"</h2><dl>"+props.filter(([,v])=>v!==undefined&&v!==null&&v!=="").map(([k,v])=>"<dt>"+esc(k)+"</dt><dd>"+esc(v)+"</dd>").join("")+"</dl>";render();
}
$("tree").addEventListener("click",e=>{const toggle=e.target.closest("[data-toggle]");if(toggle){const id=toggle.dataset.toggle;expanded.has(id)?expanded.delete(id):expanded.add(id);render();return}const node=e.target.closest("[data-id]");if(node)detail(node.dataset.id)});
$("search").addEventListener("input",render);
$("expand").onclick=()=>{if(current>=0){expanded=new Set(datasets[current].map.keys());render()}};
$("collapse").onclick=()=>{expanded.clear();render()};
$("assemblySelect").onchange=e=>switchTo(Number(e.target.value));
$("files").addEventListener("change",async e=>{for(const file of e.target.files){try{addData(file.name,parseCSV(await file.text()))}catch(err){alert(file.name+" の読込に失敗: "+err.message)}}e.target.value=""});
$("export").onclick=()=>{if(current<0)return;const d=datasets[current],data={schemaVersion:"1.0",assemblyName:d.assembly,sourceFile:d.name,nodes:d.rows.map(r=>({id:r.NodeId,parentId:r.ParentId||null,level:Number(r.Level),order:Number(r.Order),nodeType:r.NodeType,folderName:r.FolderName,folderPath:r.FolderPath,modelName:r.ModelName,componentType:r.ComponentType,filePath:r.FilePath,configuration:r.Configuration,suppressed:r.Suppressed==="true"}))},url=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:"application/json;charset=utf-8"})),a=document.createElement("a");a.href=url;a.download=d.assembly.replace(/[^\w\u3040-\u30ff\u3400-\u9fff.-]/g,"_")+"_Tree.json";a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
</script></body></html>
